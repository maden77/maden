<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maden tanpa Python</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f2f2f2; }
  h2 { margin-top: 0; }
  textarea { width: 100%; min-height: 300px; box-sizing: border-box; font: 15px monospace; padding: 10px; }
  button { margin: 8px 4px 8px 0; padding: 10px 14px; font-size: 15px; }
  pre { background: #111; color: #0f0; padding: 12px; min-height: 80px; white-space: pre-wrap; overflow-x: auto; }
  .info { color: #555; font-size: 14px; }
</style>
</head>
<body>
<h2>Maden tanpa Python</h2>
<p class="info">Interpreter Maden berjalan langsung di browser. Tidak memakai eval atau Python.</p>
<textarea id="kode">fungsi tambah(a, b) {
    kembali a + b
}

cetak("Halo dari Maden!")
cetak(tambah(2, 3))</textarea>
<br>
<button onclick="jalankan()">Jalankan</button>
<button onclick="simpan()">Simpan</button>
<button onclick="muat()">Muat</button>
<button onclick="contoh()">Contoh</button>
<button onclick="lihatToken()">Lihat Token</button>
<button onclick="bersihkan()">Bersihkan</button>
<pre id="hasil"></pre>

<script src="src-js/maden-lexer.js"></script>
<script src="src-js/maden-parser.js"></script>
<script src="src-js/maden-interpreter.js"></script>
<script>
function jalankan() {
  const area = document.getElementById('hasil');
  const output = [];
  try {
    const tokens = tokenize(document.getElementById('kode').value);
    const program = new Parser(tokens).parse();
    new MadenInterpreter(text => output.push(text)).run(program);
    area.textContent = output.join('\n') || '(tidak ada keluaran)';
  } catch (error) {
    area.textContent = 'Error: ' + (error.message || error);
  }
}

function lihatToken() {
  const area = document.getElementById('hasil');
  try {
    const tokens = tokenize(document.getElementById('kode').value);
    area.textContent = tokens.map(token =>
      `${token.type}(${JSON.stringify(token.value)}) - baris ${token.line}, kolom ${token.column}`
    ).join('\n');
  } catch (error) {
    area.textContent = 'Error: ' + (error.message || error);
  }
}

function simpan() {
  localStorage.setItem('maden-kode', document.getElementById('kode').value);
  document.getElementById('hasil').textContent = 'Kode berhasil disimpan di HP.';
}

function muat() {
  const kode = localStorage.getItem('maden-kode');
  if (kode === null) {
    document.getElementById('hasil').textContent = 'Belum ada kode yang disimpan.';
    return;
  }
  document.getElementById('kode').value = kode;
  document.getElementById('hasil').textContent = 'Kode berhasil dimuat.';
}

function contoh() {
  document.getElementById('kode').value = `fungsi tambah(a, b) {
    kembali a + b
}

fungsi main() {
    cetak("Halo dari Maden!")
    cetak(tambah(2, 3))
}

main()`;
  document.getElementById('hasil').textContent = 'Contoh dimuat.';
}

function bersihkan() {
  document.getElementById('hasil').textContent = '';
}
</script>
</body>
</html>
