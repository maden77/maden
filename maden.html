<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maden 1.0 tanpa Python</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#f2f2f2}h2{margin-top:0}textarea{width:100%;min-height:300px;box-sizing:border-box;font:15px monospace;padding:10px}button{margin:8px 4px 8px 0;padding:10px 14px;font-size:15px}pre{background:#111;color:#0f0;padding:12px;min-height:80px;white-space:pre-wrap;overflow-x:auto}.info{color:#555;font-size:14px}
</style>
</head>
<body>
<h2>Maden 1.0 tanpa Python</h2>
<p class="info">Interpreter Maden berjalan langsung di browser, termasuk array dan untuk setiap.</p>
<textarea id="kode">angka = [1, 2, 3]

untuk setiap nilai dalam angka {
    cetak(nilai)
}</textarea><br>
<button onclick="jalankan()">Jalankan</button><button onclick="simpan()">Simpan</button><button onclick="muat()">Muat</button><button onclick="contoh()">Contoh</button><button onclick="lihatToken()">Lihat Token</button><button onclick="bersihkan()">Bersihkan</button>
<pre id="hasil"></pre>
<script src="src-js/maden-lexer.js"></script>
<script src="src-js/maden-parser-array.js"></script>
<script src="src-js/maden-interpreter-array.js"></script>
<script>
function jalankan(){const area=document.getElementById('hasil'),out=[];try{const ast=new Parser(tokenize(document.getElementById('kode').value)).parse();new MadenInterpreter(v=>out.push(v)).run(ast);area.textContent=out.join('\n')||'(tidak ada keluaran)';}catch(e){area.textContent='Error: '+(e.message||e);}}
function lihatToken(){const area=document.getElementById('hasil');try{area.textContent=tokenize(document.getElementById('kode').value).map(t=>`${t.type}(${JSON.stringify(t.value)}) - baris ${t.line}, kolom ${t.column}`).join('\n');}catch(e){area.textContent='Error: '+(e.message||e);}}
function simpan(){localStorage.setItem('maden-kode',document.getElementById('kode').value);document.getElementById('hasil').textContent='Kode berhasil disimpan di HP.';}
function muat(){const k=localStorage.getItem('maden-kode');document.getElementById('hasil').textContent=k===null?'Belum ada kode yang disimpan.':'Kode berhasil dimuat.';if(k!==null)document.getElementById('kode').value=k;}
function contoh(){document.getElementById('kode').value=`fungsi kuadrat(x) {
    kembali x * x
}

angka = [1, 2, 3]
untuk setiap nilai dalam angka {
    cetak(kuadrat(nilai))
}`;document.getElementById('hasil').textContent='Contoh dimuat.';}
function bersihkan(){document.getElementById('hasil').textContent='';}
</script>
</body>
</html>
